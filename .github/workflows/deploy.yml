name: Deploy to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 필수 환경변수 검증
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ROUTE_ENGINE_URL: ${{ secrets.ROUTE_ENGINE_URL }}
          POSTGRES_DB_ENABLED: ${{ secrets.POSTGRES_DB_ENABLED }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL }}
          POSTGRES_DB_USERNAME: ${{ secrets.POSTGRES_DB_USERNAME }}
          POSTGRES_DB_PASSWORD: ${{ secrets.POSTGRES_DB_PASSWORD }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
        run: |
          MISSING=()
          for VAR in DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN DB_URL DB_USERNAME DB_PASSWORD \
                     KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_REDIRECT_URI \
                     JWT_SECRET JWT_EXPIRATION \
                     AWS_REGION AWS_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                     AI_SERVER_URL AI_API_KEY ROUTE_ENGINE_URL \
                     POSTGRES_DB_ENABLED POSTGRES_DB_URL POSTGRES_DB_USERNAME POSTGRES_DB_PASSWORD \
                     EC2_HOST EC2_USER EC2_SSH_KEY APPLE_CLIENT_ID; do
            if [ -z "${!VAR}" ]; then
              MISSING+=("$VAR")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 누락된 secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ 모든 환경변수 확인 완료"

  build-and-push:
    needs: validate-secrets
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker 이미지 빌드 및 Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/plover-be:latest

  deploy:
    needs: [validate-secrets, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ROUTE_ENGINE_URL: ${{ secrets.ROUTE_ENGINE_URL }}
          POSTGRES_DB_ENABLED: ${{ secrets.POSTGRES_DB_ENABLED }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL }}
          POSTGRES_DB_USERNAME: ${{ secrets.POSTGRES_DB_USERNAME }}
          POSTGRES_DB_PASSWORD: ${{ secrets.POSTGRES_DB_PASSWORD }}
          APP_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/plover-be:latest
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,JWT_SECRET,JWT_EXPIRATION,AWS_REGION,AWS_S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AI_SERVER_URL,AI_API_KEY,ROUTE_ENGINE_URL,POSTGRES_DB_ENABLED,POSTGRES_DB_URL,POSTGRES_DB_USERNAME,POSTGRES_DB_PASSWORD,APP_IMAGE,APPLE_CLIENT_ID
          script: |
            cd ~/plover-be
            git pull origin develop

            cat > .env <<EOF
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION=${JWT_EXPIRATION}
            AWS_REGION=${AWS_REGION}
            AWS_S3_BUCKET=${AWS_S3_BUCKET}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            AI_SERVER_URL=${AI_SERVER_URL}
            AI_API_KEY=${AI_API_KEY}
            ROUTE_ENGINE_URL=${ROUTE_ENGINE_URL}
            POSTGRES_DB_ENABLED=${POSTGRES_DB_ENABLED}
            POSTGRES_DB_URL=${POSTGRES_DB_URL}
            POSTGRES_DB_USERNAME=${POSTGRES_DB_USERNAME}
            POSTGRES_DB_PASSWORD=${POSTGRES_DB_PASSWORD}
            APP_IMAGE=${APP_IMAGE}
            APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
            EOF

            docker compose pull app
            docker compose up -d

            # 앱 기동 확인 (최대 90초 대기)
            echo "앱 기동 대기 중..."
            for i in $(seq 1 18); do
              if docker compose logs app 2>&1 | grep -q "Started PloverBeApplication"; then
                echo "✅ 앱 기동 확인"
                break
              fi
              if [ $i -eq 18 ]; then
                echo "❌ 앱 기동 타임아웃 (90초 초과)"
                echo "=== 컨테이너 로그 ==="
                docker compose logs app
                exit 1
              fi
              echo "  대기 중... ($((i * 5))초 경과)"
              sleep 5
            done

            # HTTP 헬스체크
            echo "HTTP 헬스체크 중..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:8080 || echo "000")
            if [ "$HTTP_STATUS" = "000" ]; then
              echo "❌ HTTP 응답 없음 (서버 미응답)"
              echo "=== 컨테이너 로그 ==="
              docker compose logs app
              exit 1
            fi
            echo "✅ HTTP 응답 확인 (status: $HTTP_STATUS)"

            docker image prune -f
