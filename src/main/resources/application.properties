spring.application.name=plover-be
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# PostgreSQL
postgres.datasource.enabled=${POSTGRES_DB_ENABLED:false}
postgres.datasource.url=${POSTGRES_DB_URL:}
postgres.datasource.username=${POSTGRES_DB_USERNAME:}
postgres.datasource.password=${POSTGRES_DB_PASSWORD:}
postgres.datasource.driver-class-name=org.postgresql.Driver

# Kakao OAuth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# Apple OAuth
apple.client-id=${APPLE_CLIENT_ID}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# AI Server
ai.server.url=${AI_SERVER_URL}
ai.api.key=${AI_API_KEY}

route.engine.url=${ROUTE_ENGINE_URL:http://localhost:8989}

# AWS S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:plover-be}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
